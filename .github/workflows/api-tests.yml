name: API Automation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select test environment"
        required: true
        default: qa
        type: choice
        options:
          - qa
          - stage
          - prod

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    env:
      TEST_ENV: ${{ inputs.environment || 'qa' }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java version
        run: java -version

      - name: Verify Maven version
        run: mvn -version

      - name: Run API automation tests
        run: mvn clean test -Denv=${{ env.TEST_ENV }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports-${{ env.TEST_ENV }}
          path: |
            target/surefire-reports/
          retention-days: 7